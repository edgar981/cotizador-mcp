[project]
name = "cotizador-mcp"
version = "0.1.0"
description = "MCP server giving AI agents governed access to a personal shopper's pricing engine"
readme = "README.md"
authors = [
    { name = "Edgar", email = "davidnavarro81230@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",
    "mcp>=2.3.0,<2.4",
    "pyjwt[crypto]>=2.10",
]

[project.scripts]
cotizador-mcp = "cotizador_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "moto[dynamodb]>=5.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
