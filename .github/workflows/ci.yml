# Checks for every pull request; also called by deploy.yml before a deploy.
name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CDK_VERSION: "2.1148.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -W error::DeprecationWarning

  synth:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # No AWS credentials: synthesis must not need any.
      - run: npx -y "aws-cdk@${CDK_VERSION}" synth --quiet

  diff:
    # Shows what a merge would change in AWS. Read-only role, pull requests only.
    if: github.event_name == 'pull_request' && vars.AWS_DIFF_ROLE_ARN != ''
    runs-on: ubuntu-latest
    needs: synth
    permissions:
      contents: read
      id-token: write # the OIDC token GitHub exchanges for short-lived AWS credentials
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DIFF_ROLE_ARN }}
          aws-region: us-east-2
      - run: npx -y "aws-cdk@${CDK_VERSION}" diff CotizadorMcp
