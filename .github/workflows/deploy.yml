# A merge to main deploys, with no stored AWS keys: GitHub's OIDC token is exchanged
# for a short-lived role session that may only assume the CDK bootstrap roles.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    # A ceiling, not a grant: GitHub refuses to start the run unless the caller allows
    # every permission a called job declares. Only ci.yml's `diff` job asks for
    # id-token, and it runs on pull requests only; `test` and `synth` keep contents: read.
    permissions:
      contents: read
      id-token: write

  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - run: >
          npx -y "aws-cdk@2.1148.0" deploy CotizadorMcp
          --require-approval never
          --context "alarm_email=${{ vars.ALARM_EMAIL }}"
